name = "guess-the-pokemon"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[vars]
FIREBASE_PROJECT_ID = "pokedex-app-c5e90"
GAME_API_BASE_URL = "https://guess-the-pokemon.kaique-workspace.workers.dev"
CORS_ALLOWED_ORIGINS = "https://pokedata.kaique.site,https://pokedex-app-c5e90.web.app,https://pokedex-app-c5e90.firebaseapp.com"

[assets]
directory = "./catalog"
binding = "CATALOG_ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "guess-the-pokemon"
