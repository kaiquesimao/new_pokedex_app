name = "guess-the-pokemon"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[vars]
FIREBASE_PROJECT_ID = "replace-with-firebase-project-id"
GAME_API_BASE_URL = "https://replace-with-worker-url"
CORS_ALLOWED_ORIGINS = "https://replace-with-app-origin"

[assets]
directory = "./catalog"
binding = "CATALOG_ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "guess-the-pokemon"
# Replace this placeholder locally or in CI. Never commit a real account ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
