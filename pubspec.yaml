name: pokedex_app
description: "PokeData - Pokédex para fãs"
publish_to: 'none'
version: 1.6.3+18
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.2.0
  curved_navigation_bar_pro: ^2.1.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  in_app_review: ^2.0.12
  intl: any
  material_ui: ^1.5.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  sign_in_with_apple: ^8.2.0
  translator: ^1.0.4+1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/images/splash/
    - assets/images/elements/
    - assets/images/components/
    - assets/images/characters/
    - assets/images/regions/
    - assets/legal/
    - assets/game/catalog-v1.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
