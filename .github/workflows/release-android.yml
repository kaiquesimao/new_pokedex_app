# Build signed AAB and upload to Play Store (internal + open testing / beta by default).
# Trigger: version change on master (after PR merge), or manual run from master.
# Creates the vX.Y.Z tag + GitHub Release here if missing (never tag from PR branches).
name: Release Android
run-name: Release Android (${{ inputs.track || 'internal,beta' }}) · ${{ github.ref_name }}

on:
  push:
    branches: [master]
    paths:
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track(s)
        required: true
        default: internal,beta
        type: choice
        options:
          - internal,beta
          - beta
          - internal
          - alpha
      upload:
        description: Upload AAB to Play Store after build
        required: true
        default: true
        type: boolean

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decide:
    name: Should release
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        name: Compare pubspec version with previous master
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch from master — releasing."
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit — releasing."
            exit 0
          fi

          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$before"
          fi

          prev="$(git show "$before:pubspec.yaml" | grep -E '^version:' | head -n1 || true)"
          curr="$(grep -E '^version:' pubspec.yaml | head -n1)"
          echo "Previous: ${prev:-<none>}"
          echo "Current:  $curr"
          if [ "$prev" = "$curr" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "pubspec version unchanged — skipping Android release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "pubspec version changed — releasing."
          fi

  release:
    name: Analyze, build AAB/APK, upload
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed to create/push the version tag when attaching GH Release assets.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Require release secrets
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          DO_UPLOAD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
        run: |
          missing=0
          for name in DART_DEFINES_JSON GOOGLE_SERVICES_JSON KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$DO_UPLOAD" = "true" ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON (required when uploading)"
            missing=1
          fi
          exit "$missing"

      - name: Write dart_defines.json
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: printf '%s\n' "$DART_DEFINES_JSON" > dart_defines.json

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' pubspec.yaml | head -n1)"
          if [[ ! "$line" =~ ^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)[[:space:]]*$ ]]; then
            echo "::error::Unexpected pubspec version: $line (expected x.y.z+build)"
            exit 1
          fi
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          number="${BASH_REMATCH[4]}"

          if (( number < 1 )); then
            echo "::error::Build number must be >= 1 (got $number)"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $name+$number"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
          --dart-define-from-file=dart_defines.json
          --obfuscate
          --split-debug-info=build/debug-info
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json

      - name: Build APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
          --dart-define-from-file=dart_defines.json
          --obfuscate
          --split-debug-info=build/debug-info
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json

      - name: Upload Dart obfuscation symbols
        uses: actions/upload-artifact@v7
        with:
          # Keep private to Actions artifacts — do not attach to public GitHub Releases.
          name: debug-info-${{ steps.version.outputs.name }}+${{ steps.version.outputs.number }}
          path: |
            build/debug-info
            build/app/obfuscation.map.json
          retention-days: 90
          if-no-files-found: error

      # Optional: SENTRY_AUTH_TOKEN with project:releases + org:read scopes.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN unset — skipping Sentry symbol upload."
            exit 0
          fi
          dart run sentry_dart_plugin

      - name: Stage release binaries
        id: binaries
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.name }}"
          number="${{ steps.version.outputs.number }}"
          staging="build/github-release-assets"
          mkdir -p "$staging"
          aab_src="build/app/outputs/bundle/release/app-release.aab"
          apk_src="build/app/outputs/flutter-apk/app-release.apk"
          aab_out="${staging}/pokedata-${name}+${number}.aab"
          apk_out="${staging}/pokedata-${name}+${number}.apk"
          cp "$aab_src" "$aab_out"
          cp "$apk_src" "$apk_out"
          echo "directory=${staging}" >> "$GITHUB_OUTPUT"
          echo "aab=${aab_out}" >> "$GITHUB_OUTPUT"
          echo "apk=${apk_out}" >> "$GITHUB_OUTPUT"
          ls -la "$staging"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.version.outputs.name }}+${{ steps.version.outputs.number }}
          path: |
            ${{ steps.binaries.outputs.aab }}
            ${{ steps.binaries.outputs.apk }}
          retention-days: 30

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          FULL: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.number }}
          AAB: ${{ steps.binaries.outputs.aab }}
          APK: ${{ steps.binaries.outputs.apk }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "## ${FULL}"
            echo
            en="store/google_play/en-US/changelogs/${VERSION_CODE}.txt"
            pt="store/google_play/pt-BR/changelogs/${VERSION_CODE}.txt"
            if [ -f "$en" ]; then
              echo "### What's new"
              echo
              cat "$en"
              echo
            fi
            if [ -f "$pt" ]; then
              echo "### Novidades"
              echo
              cat "$pt"
              echo
            fi
            echo "### Downloads"
            echo
            echo "- **APK** (sideload / direct install): attached below"
            echo "- **AAB** (Play upload format): attached below"
            echo
            echo "Play Store track upload is handled by this workflow when enabled."
          } >"$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release ${TAG} with APK/AAB."
            gh release upload "$TAG" "$APK" "$AAB" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes" --latest
          else
            echo "Creating GitHub Release ${TAG} with APK/AAB."
            # Tag may not exist yet if version was bumped without scripts/release.*
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
            gh release create "$TAG" "$APK" "$AAB" \
              --title "$TAG" \
              --notes-file "$notes" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
          echo "Published: $(gh release view "$TAG" --json url -q .url)"

      # Source of truth: store/google_play/<locale>/changelogs/<versionCode>.txt
      # Action expects flat whatsnew-<BCP47> files (no extension).
      - name: Stage Play Store release notes
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload)
        id: whatsnew
        run: |
          set -euo pipefail
          version_code="${{ steps.version.outputs.number }}"
          staging="build/play-whatsnew"
          mkdir -p "$staging"
          found=0
          shopt -s nullglob
          for locale_dir in store/google_play/*/; do
            locale="$(basename "$locale_dir")"
            src="${locale_dir}changelogs/${version_code}.txt"
            if [ -f "$src" ]; then
              cp "$src" "${staging}/whatsnew-${locale}"
              found=$((found + 1))
              echo "Staged release notes for ${locale} from ${src}"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No Play Store changelogs for versionCode ${version_code}."
            echo "Add store/google_play/<locale>/changelogs/${version_code}.txt (e.g. en-US, pt-BR)."
            exit 1
          fi
          echo "directory=${staging}" >> "$GITHUB_OUTPUT"
          ls -la "$staging"

      - name: Upload to Play Store
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kaiquesimao.pokedex
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track || 'internal,beta' }}
          status: completed
          releaseName: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.number }}
          whatsNewDirectory: ${{ steps.whatsnew.outputs.directory }}
