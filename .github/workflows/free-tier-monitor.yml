# Monitor Workers + D1 free-tier daily usage via Cloudflare GraphQL Analytics.
name: Free-tier monitor
run-name: Free-tier monitor · ${{ github.event_name }}

on:
  schedule:
    # Every 6 hours — catch spikes before UTC day reset.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: free-tier-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: Check Workers + D1 quotas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/guess-the-pokemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/guess-the-pokemon/package-lock.json

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name (needs Account Analytics Read)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Report free-tier usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SCRIPT_NAME: guess-the-pokemon
          D1_DATABASE_ID: ee058ebd-92d3-473e-b81b-2a7b4f7933fd
          WARN_RATIO: '0.7'
          FAIL_RATIO: '0.85'
        run: npm run monitor:free-tier
