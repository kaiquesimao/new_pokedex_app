# Creates a GitHub Release (Releases tab) when a version tag is pushed.
# Tags must point at a commit already on master (after PR merge). Prefer bumping
# on the PR with scripts/release.ps1|release.sh (no tag); Release Android on
# master creates the tag + attaches APK/AAB. This workflow is a safety net /
# notes refresh when a v* tag lands on master.
name: GitHub Release
run-name: GitHub Release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.6.1). Leave empty to use the latest v* tag.
        required: false
        type: string

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_TAG:-}" ]; then
              tag="$INPUT_TAG"
            else
              tag="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
            fi
            if [ -z "$tag" ]; then
              echo "::error::No tag provided and no v* tags found."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} does not exist."
              exit 1
            fi
            git checkout -q "$tag"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Unexpected tag format: ${tag} (expected vX.Y.Z)"
            exit 1
          fi

          # Refuse releases for tags that are not on master (e.g. premature PR tags).
          git fetch origin master
          tag_commit="$(git rev-list -n1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "::error::Tag ${tag} (${tag_commit}) is not on master."
            echo "GitHub Releases are published only after the version PR merges."
            echo "Bump with scripts/release.* on the PR (no tag); merge; Release Android tags."
            exit 1
          fi

          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          echo "semver=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag (on master)"

      - name: Resolve pubspec version
        id: version
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' pubspec.yaml | head -n1)"
          if [[ ! "$line" =~ ^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)[[:space:]]*$ ]]; then
            echo "::error::Unexpected pubspec version: $line (expected x.y.z+build)"
            exit 1
          fi
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          number="${BASH_REMATCH[4]}"
          expected="${{ steps.tag.outputs.semver }}"
          if [ "$name" != "$expected" ]; then
            echo "::error::Tag v${expected} does not match pubspec name ${name}+${number}."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "full=${name}+${number}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${name}+${number}"

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          version_code="${{ steps.version.outputs.number }}"
          full="${{ steps.version.outputs.full }}"
          notes="$(mktemp)"
          {
            echo "## ${full}"
            echo
            en="store/google_play/en-US/changelogs/${version_code}.txt"
            pt="store/google_play/pt-BR/changelogs/${version_code}.txt"
            if [ -f "$en" ]; then
              echo "### What's new"
              echo
              cat "$en"
              echo
            fi
            if [ -f "$pt" ]; then
              echo "### Novidades"
              echo
              cat "$pt"
              echo
            fi
            if [ ! -f "$en" ] && [ ! -f "$pt" ]; then
              echo "App version \`${full}\`."
              echo
              echo "_No Play Store changelog files found for versionCode ${version_code}._"
              echo
            fi
            echo "### Deploy"
            echo
            echo "- Signed **APK** and **AAB** are attached by **Release Android** when this version reaches \`master\`."
            echo "- Tag: \`${{ steps.tag.outputs.name }}\`"
          } >"$notes"
          echo "path=${notes}" >> "$GITHUB_OUTPUT"
          echo "---- release notes ----"
          cat "$notes"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          NOTES: ${{ steps.notes.outputs.path }}
          FULL: ${{ steps.version.outputs.full }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes and marking latest."
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --latest
          else
            echo "Creating release ${TAG} (${FULL})."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
          echo "Published: $(gh release view "$TAG" --json url -q .url)"
